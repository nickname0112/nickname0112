<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px 40px;
    }

    header h1 {
      font-size: 1.8rem;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: #bdc3c7;
      text-decoration: none;
      margin-right: 20px;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: white;
    }

    main {
      flex: 1;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .hero {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h2 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .hero p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.7;
    }

    .hero button {
      margin-top: 25px;
      padding: 12px 30px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .hero button:hover {
      background-color: #2980b9;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .card p {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.6;
    }

    footer {
      background-color: #2c3e50;
      color: #bdc3c7;
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Website</h1>
    <nav>
      <a href="#">홈</a>
      <a href="#">소개</a>
      <a href="#">서비스</a>
      <a href="#">연락처</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>환영합니다!</h2>
      <p>이곳은 기본 HTML 페이지입니다. 원하는 내용으로 자유롭게 수정해 보세요.</p>
      <button onclick="alert('버튼이 클릭되었습니다!')">시작하기</button>
    </section>

    <section class="cards">
      <div class="card">
        <h3>기능 1</h3>
        <p>여기에 첫 번째 기능이나 서비스에 대한 설명을 작성하세요.</p>
      </div>
      <div class="card">
        <h3>기능 2</h3>
        <p>여기에 두 번째 기능이나 서비스에 대한 설명을 작성하세요.</p>
      </div>
      <div class="card">
        <h3>기능 3</h3>
        <p>여기에 세 번째 기능이나 서비스에 대한 설명을 작성하세요.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
